:root[data-theme="dark"] {
  --bg: #121110; --surface: #1B1917; --sunk: #222020; --ink: #F1ECE5; --ink-2: #B8AFA5; --ink-3: #857D74;
  --line: #2E2A27; --accent: #D9774D; --accent-ink: #160F0B; --accent-soft: #3A2419; --bar: #3E3935; --bar-strong: #6A625A;
  --good: #6CC594; --bad: #EC7C6E; --bad-soft: #3B1F1B; --top: #0A0909; --top-ink: #F1ECE5; --top-dim: #857D74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-3); font-size: 13px; }

/* ---------- Topo ---------- */
.top { background: var(--top); color: var(--top-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top-in { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand .logo { flex: none; display: block; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-t b { font-family: var(--f-display); font-size: 16px; font-weight: 700; white-space: nowrap; }
.brand-t span { font-size: 12px; color: var(--top-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-demo { font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; }
.tab { background: none; border: 0; color: var(--top-dim); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.tab:hover { color: var(--top-ink); }
.tab[aria-current="page"] { color: var(--top-ink); background: rgba(255,255,255,.09); }
.top .btn-p { padding: 8px 14px; }
.sair { background: none; border: 0; color: var(--top-dim); padding: 8px; border-radius: 8px; font-size: 13px; }
.sair:hover { color: var(--top-ink); }

/* Navegação inferior (celular) */
.nav { display: none; }
@media (max-width: 719px) {
  .top .tabs, .top .btn-p { display: none; }
  .nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; align-items: center; }
  .nav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 4px 10px; min-width: 64px; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button[aria-current="page"] { color: var(--ink); }
  .nav .mais { width: 48px; height: 48px; min-width: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); padding: 0; place-items: center; box-shadow: 0 4px 14px rgba(191,92,51,.35); }
  .nav .mais svg { width: 24px; height: 24px; }
  main { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px) !important; }
}

main { padding-block: 20px 48px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.view > * { min-width: 0; }

/* ---------- Controles ---------- */
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; min-width: 0; flex: 1 1 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip:hover { border-color: var(--bar-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.datas { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.datas input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--bar-strong); }
.btn-p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-p:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn-g { background: none; border-color: transparent; color: var(--ink-2); }
.btn-g:hover { background: var(--sunk); border-color: transparent; }
.btn[disabled] { opacity: .55; cursor: default; }

.cab { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.cab h1 { font-size: 22px; margin-right: auto; }
.sync { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); background: none; border: 0; padding: 0; }
button.sync:hover { color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.dot.erro { background: var(--bad); }
.dot.velho { background: var(--accent); }

/* ---------- Funil ---------- */
.funil { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.etapas, .taxas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.etapa { padding: 18px 20px; display: grid; gap: 2px; min-width: 0; }
.etapa + .etapa { border-left: 1px solid var(--line); }
.etapa span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.etapa b { font-family: var(--f-display); font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.etapa.foco b { color: var(--accent); }
.taxas { background: var(--sunk); }
.taxa { padding: 12px 20px; display: grid; gap: 0; min-width: 0; }
.taxa + .taxa { border-left: 1px solid var(--line); }
.taxa b { font-size: 16px; font-variant-numeric: tabular-nums; }
.taxa span { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 719px) {
  .etapas, .taxas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .etapa, .taxa { padding-inline: 16px; }
  .etapa:nth-child(3), .taxa:nth-child(3) { border-left: 0; }
  .etapa:nth-child(n+3), .taxa:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* ---------- Seções ---------- */
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-h h2 { font-size: 17px; margin-right: auto; }
@media (max-width: 719px) { .sec { padding: 16px; } }
.legenda { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }

/* ---------- Reservas ---------- */
.busca { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; width: 100%; }
.resumo { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.resumo b { color: var(--ink); font-variant-numeric: tabular-nums; }
.lista { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.res { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; background: none; text-align: left; width: 100%; }
.res + .res { border-top: 1px solid var(--line); }
.res:hover { background: var(--sunk); }
.res .d { text-align: center; line-height: 1.05; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.res .d b { display: block; font-family: var(--f-display); font-size: 20px; color: var(--ink); letter-spacing: 0; }
.res .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.res .m { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.res .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.res.cancelada .n, .res.cancelada .val { text-decoration: line-through; color: var(--ink-3); }
.vazio { padding: 36px 18px; text-align: center; color: var(--ink-2); display: grid; gap: 12px; justify-items: center; }

/* ---------- Folha (formulário) ---------- */
.veu { position: fixed; inset: 0; background: rgba(10,9,9,.45); z-index: 40; display: flex; justify-content: flex-end; }
.folha { background: var(--surface); width: min(440px, 100%); height: 100%; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) 20px; display: grid; gap: 18px; align-content: start; }
@media (max-width: 559px) {
  .veu { align-items: flex-end; }
  .folha { height: auto; max-height: 92%; border-radius: 18px 18px 0 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); }
}
.folha-h { display: flex; align-items: center; gap: 10px; }
.folha-h h2 { font-size: 20px; margin-right: auto; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.campo { display: grid; gap: 5px; min-width: 0; }
.campo.full { grid-column: 1 / -1; }
.campo label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.campo label small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.campo input, .campo textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.campo textarea { resize: vertical; min-height: 60px; }
.campo.erro input { border-color: var(--bad); }
.noites { font-size: 12.5px; color: var(--ink-3); grid-column: 1 / -1; margin-top: -8px; min-height: 1em; }
.acoes { display: flex; gap: 8px; align-items: center; }
.acoes .btn-p { margin-left: auto; }
@media (max-width: 559px) { .acoes .btn-p { flex: 1; padding-block: 12px; } }
.btn-d { color: var(--bad); }
.confirma { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 12px; display: grid; gap: 10px; font-size: 14px; }
.aviso { background: var(--bad-soft); color: var(--bad); padding: 10px 12px; border-radius: 10px; font-size: 13px; overflow-wrap: anywhere; }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 40px; }
.login-box { width: min(360px, 100%); display: grid; gap: 20px; }
.login-box .marca { display: flex; gap: 12px; align-items: center; }
.login-box h1 { font-size: 22px; }
.login-box form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.login-box .btn-p { padding: 11px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; font-size: 13.5px; justify-self: start; }
.msg { font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); color: var(--ink-2); }
.msg.erro { background: var(--bad-soft); color: var(--bad); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 719px) { .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 16px); } }
.carregando { color: var(--ink-3); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CRM Automatizza — MVP WhatsApp × Reservas (exclusivo do tráfego pago)
   Conversas e investimento chegam da Meta (função meta-sync no Supabase).
   Reservas vindas do anúncio são lançadas à mão pela equipe do hotel.
   ===================================================================== */
(function () {
  "use strict";

  const CFG = window.CRM_CONFIG || {};
  const DEMO = !CFG.supabaseUrl || !CFG.supabaseAnonKey;
  const TZ = "America/Fortaleza";

  // ---------- utilidades ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const brl0 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const int = new Intl.NumberFormat("pt-BR");
  const pct = new Intl.NumberFormat("pt-BR", { style: "percent", maximumFractionDigits: 1 });
  const fmtMoeda = (v) => (v == null || !isFinite(v) ? "—" : brl.format(v));
  const fmtMoeda0 = (v) => (v == null || !isFinite(v) ? "—" : (Math.abs(v) >= 1000 ? brl0.format(v) : brl.format(v)));
  const hoje = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
  const somarDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const diasEntre = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);
  const ddmm = (iso) => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "";
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const dataLonga = (iso) => `${+iso.slice(8, 10)} ${MESES[+iso.slice(5, 7) - 1]}`;
  const parseValor = (s) => { s = String(s || "").trim().replace(/[R$\s]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = Number(s); return s === "" ? NaN : isFinite(n) ? n : NaN; };
  const div = (a, b) => (b > 0 ? a / b : null);
  const noitesTxt = (n) => `${n} ${n === 1 ? "noite" : "noites"}`;

  function periodo(id, custom) {
    const h = hoje(), inicioMes = h.slice(0, 8) + "01";
    switch (id) {
      case "hoje": return { desde: h, ate: h };
      case "ontem": { const o = somarDias(h, -1); return { desde: o, ate: o }; }
      case "7d": return { desde: somarDias(h, -6), ate: h };
      case "mes": return { desde: inicioMes, ate: h };
      case "mes-ant": { const fim = somarDias(inicioMes, -1); return { desde: fim.slice(0, 8) + "01", ate: fim }; }
      default: return custom;
    }
  }
  const PERIODOS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7d", "7 dias"], ["mes", "Este mês"], ["mes-ant", "Mês passado"], ["custom", "Datas…"]];
  const rotuloPeriodo = (p) => p.desde === p.ate ? dataLonga(p.desde) : `${dataLonga(p.desde)} – ${dataLonga(p.ate)}`;

  // ---------- estado ----------
  const S = {
    user: null, view: "painel",
    per: "hoje", custom: { desde: somarDias(hoje(), -13), ate: hoje() },
    resPer: "mes", resCustom: { desde: hoje().slice(0, 8) + "01", ate: hoje() }, busca: "",
    config: {}, loginModo: "entrar", loginMsg: null,
  };

  // =====================================================================
  // Dados: Supabase de verdade, ou fictícios em memória (demonstração)
  // =====================================================================
  const api = DEMO ? criarDemo() : criarSupabase();

  function criarSupabase() {
    const tipoLink = new URLSearchParams(location.hash.slice(1)).get("type");
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    const ok = ({ data, error }) => { if (error) throw error; return data; };
    return {
      tipoLink,
      onAuth: (fn) => sb.auth.onAuthStateChange((ev, sess) => fn(ev, sess)),
      sessao: async () => (await sb.auth.getSession()).data.session,
      entrar: async (email, senha) => ok(await sb.auth.signInWithPassword({ email, password: senha })),
      sair: () => sb.auth.signOut(),
      recuperar: async (email) => ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })),
      definirSenha: async (senha) => ok(await sb.auth.updateUser({ password: senha })),
      trafego: async (desde, ate) => ok(await sb.from("trafego_diario").select("data,investimento,conversas").gte("data", desde).lte("data", ate).limit(5000)),
      reservas: async (desde, ate) => ok(await sb.from("reservas").select("*").gte("data_confirmacao", desde).lte("data_confirmacao", ate).order("data_confirmacao", { ascending: false }).order("criado_em", { ascending: false }).limit(2000)),
      salvarReserva: async (r) => {
        const { id, ...dados } = r;
        return id ? ok(await sb.from("reservas").update(dados).eq("id", id).select().single())
                  : ok(await sb.from("reservas").insert(dados).select().single());
      },
      config: async () => Object.fromEntries((ok(await sb.from("config").select("chave,valor")) || []).map((c) => [c.chave, c.valor])),
      sincronizar: async () => { const { data, error } = await sb.functions.invoke("meta-sync", { body: { dias: 7 } }); if (error) throw error; if (data && data.ok === false) throw new Error(data.erro); return data; },
    };
  }

  function criarDemo() {
    let seed = 20261014;
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
    const h = hoje();
    const nomes = ["Mariana Lopes", "Carlos Eduardo", "Ana Paula Ribeiro", "Rafael Moura", "Juliana Teixeira", "Fernando Alencar", "Patrícia Gomes", "Thiago Sampaio", "Luciana Freitas", "Marcos Vinícius", "Camila Bezerra", "Roberto Pinheiro", "Aline Cavalcante", "Diego Montenegro", "Beatriz Holanda", "Gustavo Araújo", "Renata Feitosa", "Paulo Sérgio", "Larissa Queiroz", "Igor Tavares"];
    const traf = [], res = [];
    for (let i = 75; i >= 0; i--) {
      const d = somarDias(h, -i);
      const fds = [5, 6].includes(new Date(d + "T12:00:00Z").getUTCDay());
      const parcial = i === 0 ? 0.55 : 1;
      const inv = (42 + rnd() * 14) * parcial;
      const conv = Math.round((7 + rnd() * 9 + (fds ? 3 : 0)) * parcial);
      traf.push({ data: d, investimento: +inv.toFixed(2), conversas: conv });
      const nRes = Math.floor(conv * (0.07 + rnd() * 0.07) + rnd() * 0.6);
      for (let k = 0; k < nRes; k++) {
        const noites = 1 + Math.floor(rnd() * 4), ci = somarDias(d, Math.floor(rnd() * 20));
        res.push({
          id: "demo-" + d + "-" + k, data_confirmacao: d, hospede: nomes[Math.floor(rnd() * nomes.length)],
          telefone: "(85) 9" + Math.floor(8000 + rnd() * 1999) + "-" + Math.floor(1000 + rnd() * 8999),
          checkin: ci, checkout: somarDias(ci, noites), valor: Math.round(noites * (290 + rnd() * 160) / 10) * 10,
          observacao: noites > 2 && rnd() < 0.4 ? "Casal, pediu andar alto" : "",
          status: rnd() < 0.05 ? "cancelada" : "confirmada", criado_em: d + "T15:00:00Z",
        });
      }
    }
    const cfg = { nome_hotel: CFG.nomeHotel || "WA Hotel Fortaleza", ultima_sincronizacao: new Date(Date.now() - 23 * 60e3).toISOString(), ultimo_erro_sincronizacao: null };
    const espera = (v) => new Promise((r) => setTimeout(() => r(v), 100));
    return {
      demo: true,
      onAuth: () => {}, sessao: async () => ({ user: { id: "p1", email: "pedro@automatizza.com.br" } }),
      entrar: async () => {}, sair: async () => {}, recuperar: async () => {}, definirSenha: async () => {},
      trafego: async (a, b) => espera(traf.filter((t) => t.data >= a && t.data <= b).map((t) => ({ ...t }))),
      reservas: async (a, b) => espera(res.filter((r) => r.data_confirmacao >= a && r.data_confirmacao <= b).sort((x, y) => y.data_confirmacao.localeCompare(x.data_confirmacao) || y.criado_em.localeCompare(x.criado_em)).map((r) => ({ ...r }))),
      salvarReserva: async (r) => {
        if (r.id) { Object.assign(res.find((x) => x.id === r.id), r); return espera(r); }
        const n = { ...r, status: "confirmada", id: "demo-n" + Date.now(), criado_em: new Date().toISOString() }; res.push(n); return espera(n);
      },
      config: async () => espera({ ...cfg }),
      sincronizar: async () => { await espera(); await espera(); cfg.ultima_sincronizacao = new Date().toISOString(); return { ok: true }; },
    };
  }

  // =====================================================================
  // Interface

  const LOGO = (h = 30) => `<img class="logo" src="${LOGO_URI}" alt="Automatizza" height="${h}" style="height:${h}px;width:auto">`;
  const TILE = (s = 48) => `<img src="${TILE_URI}" alt="Automatizza" width="${s}" height="${s}" style="border-radius:${Math.round(s * 0.22)}px">`;
  const ICO = {
    painel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>`,
    reservas: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
    mais: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  };

  let toastT;
  function toast(msg) {
    let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600);
  }
  function msgErro(e) {
    const m = (e && (e.message || e.error_description)) || String(e);
    if (/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
    if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Confira a internet e tente de novo.";
    return m;
  }

  // ---------- Login ----------
  function telaLogin() {
    const modo = S.loginModo;
    const titulo = { entrar: "Entrar", recuperar: "Recuperar senha", senha: "Crie sua senha" }[modo];
    app.innerHTML = `
      <div class="login wrap"><div class="login-box">
        <div class="marca">${TILE(48)}<div><h1>CRM Automatizza</h1><div class="muted">${esc(CFG.nomeHotel || "")}</div></div></div>
        <form id="f-login" novalidate>
          <h2 style="font-size:17px">${titulo}</h2>
          ${S.loginMsg ? `<div class="msg ${S.loginMsg.erro ? "erro" : ""}" role="alert">${esc(S.loginMsg.t)}</div>` : ""}
          ${modo !== "senha" ? `<div class="campo"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" required></div>` : ""}
          ${modo !== "recuperar" ? `<div class="campo"><label for="l-senha">${modo === "senha" ? "Nova senha <small>(mínimo 8 caracteres)</small>" : "Senha"}</label><input id="l-senha" type="password" autocomplete="${modo === "senha" ? "new-password" : "current-password"}" minlength="8" required></div>` : ""}
          <button class="btn btn-p" type="submit" id="l-ok">${modo === "recuperar" ? "Enviar link por e-mail" : modo === "senha" ? "Salvar senha e entrar" : "Entrar"}</button>
          ${modo === "entrar" ? `<button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>` : ""}
          ${modo === "recuperar" ? `<button class="link" type="button" id="l-voltar">Voltar para o login</button>` : ""}
        </form>
      </div></div>`;
    $("#l-esqueci")?.addEventListener("click", () => { S.loginModo = "recuperar"; S.loginMsg = null; telaLogin(); });
    $("#l-voltar")?.addEventListener("click", () => { S.loginModo = "entrar"; S.loginMsg = null; telaLogin(); });
    $("#f-login").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const email = $("#l-email")?.value.trim(), senha = $("#l-senha")?.value;
      $("#l-ok").disabled = true;
      try {
        if (modo === "entrar") { await api.entrar(email, senha); }
        else if (modo === "recuperar") { await api.recuperar(email); S.loginMsg = { t: "Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha." }; S.loginModo = "entrar"; telaLogin(); }
        else {
          if (!senha || senha.length < 8) throw new Error("A senha precisa ter pelo menos 8 caracteres.");
          await api.definirSenha(senha); history.replaceState(null, "", location.pathname); S.loginMsg = null; await iniciarApp();
        }
      } catch (e) { S.loginMsg = { t: msgErro(e), erro: true }; telaLogin(); }
    });
  }

  // ---------- Casca ----------
  function casca() {
    const abas = [["painel", "Painel"], ["reservas", "Reservas"]];
    const atual = (id) => (S.view === id ? 'aria-current="page"' : "");
    const navBtn = ([id, t]) => `<button data-view="${id}" ${atual(id)}>${ICO[id]}${t}</button>`;
    app.innerHTML = `
      <header class="top"><div class="wrap top-in">
        <div class="brand">${LOGO(36)}<div class="brand-t"><b>CRM Automatizza</b><span>${esc(S.config.nome_hotel || CFG.nomeHotel || "")}</span></div>${api.demo ? `<span class="pill-demo" title="Dados fictícios">Demonstração</span>` : ""}</div>
        <nav class="tabs" aria-label="Seções">${abas.map(([id, t]) => `<button class="tab" data-view="${id}" ${atual(id)}>${t}</button>`).join("")}</nav>
        <button class="btn btn-p" data-nova>+ Nova reserva</button>
        ${api.demo ? "" : `<button class="sair" id="sair">Sair</button>`}
      </div></header>
      <main class="wrap"><div id="view" class="view"></div></main>
      <nav class="nav" aria-label="Seções">${navBtn(abas[0])}<button class="mais" data-nova aria-label="Nova reserva">${ICO.mais}</button>${navBtn(abas[1])}</nav>`;
    app.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { S.view = b.dataset.view; casca(); window.scrollTo(0, 0); }));
    app.querySelectorAll("[data-nova]").forEach((b) => b.addEventListener("click", () => abrirForm()));
    $("#sair")?.addEventListener("click", async () => { await api.sair(); });
    ({ painel: viewPainel, reservas: viewReservas })[S.view]();
  }

  function seletorPeriodo(atual, custom, prefixo) {
    return `<div class="bar">
      <div class="chips" role="group" aria-label="Período">${PERIODOS.map(([id, t]) => `<button class="chip" data-per="${id}" aria-pressed="${atual === id}">${t}</button>`).join("")}</div>
      ${atual === "custom" ? `<div class="datas"><input type="date" id="${prefixo}-de" value="${custom.desde}" max="${hoje()}" aria-label="De"><span>até</span><input type="date" id="${prefixo}-ate" value="${custom.ate}" max="${hoje()}" aria-label="Até"></div>` : ""}
    </div>`;
  }
  function ligarPeriodo(root, chave, chaveCustom, prefixo, redesenhar) {
    root.querySelectorAll("[data-per]").forEach((b) => b.addEventListener("click", () => { S[chave] = b.dataset.per; redesenhar(); }));
    const de = $("#" + prefixo + "-de", root), ate = $("#" + prefixo + "-ate", root);
    const mudou = () => { if (de.value && ate.value && de.value <= ate.value) { S[chaveCustom] = { desde: de.value, ate: ate.value }; redesenhar(); } };
    de?.addEventListener("change", mudou); ate?.addEventListener("change", mudou);
    const chips = root.querySelector(".chips"), ativo = root.querySelector('.chip[aria-pressed="true"]');
    if (chips && ativo && ativo.offsetLeft + ativo.offsetWidth > chips.clientWidth) chips.scrollLeft = ativo.offsetLeft - 16;
  }

  // ---------- Painel ----------
  async function viewPainel() {
    const v = $("#view");
    const p = periodo(S.per, S.custom);
    const g = diasEntre(p.desde, p.ate) >= 6 ? p : { desde: somarDias(p.ate, -13), ate: p.ate };
    const busca = { desde: p.desde < g.desde ? p.desde : g.desde, ate: p.ate };
    v.innerHTML = `${seletorPeriodo(S.per, S.custom, "pp")}<div class="carregando">Carregando…</div>`;
    ligarPeriodo(v, "per", "custom", "pp", viewPainel);
    let traf, res, cfg;
    try { [traf, res, cfg] = await Promise.all([api.trafego(busca.desde, busca.ate), api.reservas(busca.desde, busca.ate), api.config()]); }
    catch (e) { $(".carregando", v).outerHTML = `<div class="aviso">Não foi possível carregar os dados: ${esc(msgErro(e))}</div>`; return; }
    if (S.view !== "painel") return;
    S.config = cfg;

    const naP = (d) => d >= p.desde && d <= p.ate;
    const tP = traf.filter((t) => naP(t.data));
    const inv = tP.reduce((s, t) => s + +t.investimento, 0);
    const conv = tP.reduce((s, t) => s + +t.conversas, 0);
    const rP = res.filter((r) => naP(r.data_confirmacao) && r.status !== "cancelada");
    const nRes = rP.length, receita = rP.reduce((s, r) => s + +r.valor, 0);

    const dias = []; for (let d = g.desde; d <= g.ate; d = somarDias(d, 1)) dias.push(d);
    const porDia = Object.fromEntries(dias.map((d) => [d, { c: 0, r: 0 }]));
    traf.forEach((t) => { if (porDia[t.data]) porDia[t.data].c += +t.conversas; });
    res.forEach((r) => { if (r.status !== "cancelada" && porDia[r.data_confirmacao]) porDia[r.data_confirmacao].r += 1; });

    const ult = cfg.ultima_sincronizacao ? new Date(cfg.ultima_sincronizacao) : null;
    const minAtras = ult ? Math.round((Date.now() - ult) / 60e3) : null;
    const quando = ult ? (minAtras < 60 ? `há ${Math.max(1, minAtras)} min` : ult.toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })) : "nunca";
    const estado = cfg.ultimo_erro_sincronizacao ? "erro" : (!ult || minAtras > 180 ? "velho" : "");
    const roas = div(receita, inv);

    v.innerHTML = `
      ${seletorPeriodo(S.per, S.custom, "pp")}
      <div class="cab"><h1>${rotuloPeriodo(p)}</h1>
        <button class="sync" id="sinc" title="Buscar dados da Meta agora"><span class="dot ${estado}"></span><span id="sinc-t">Meta ${quando} · atualizar</span></button></div>
      ${cfg.ultimo_erro_sincronizacao ? `<div class="aviso">A busca de dados da Meta falhou: ${esc(cfg.ultimo_erro_sincronizacao)}</div>` : ""}

      <section class="funil" aria-label="Funil do WhatsApp">
        <div class="etapas">
          <div class="etapa"><span>Investimento</span><b>${fmtMoeda0(inv)}</b></div>
          <div class="etapa"><span>Conversas</span><b>${int.format(conv)}</b></div>
          <div class="etapa foco"><span>Reservas</span><b>${int.format(nRes)}</b></div>
          <div class="etapa"><span>Receita</span><b>${fmtMoeda0(receita)}</b></div>
        </div>
        <div class="taxas">
          <div class="taxa"><b>${fmtMoeda(div(inv, conv))}</b><span>por conversa</span></div>
          <div class="taxa"><b>${div(nRes, conv) == null ? "—" : pct.format(nRes / conv)}</b><span>conversão</span></div>
          <div class="taxa"><b>${fmtMoeda(div(inv, nRes))}</b><span>por reserva</span></div>
          <div class="taxa"><b>${roas == null ? "—" : roas.toFixed(1).replace(".", ",") + "×"}</b><span>ROAS</span></div>
        </div>
      </section>

      <section class="sec" aria-label="Conversas e reservas por dia">
        <div class="sec-h"><h2>Por dia</h2>
          <div class="legenda"><span><i style="background:var(--bar-strong)"></i>Conversas</span><span><i style="background:var(--accent)"></i>Reservas</span>${g === p ? "" : `<span class="muted">últimos 14 dias</span>`}</div></div>
        <div class="chart">${grafico(...(S._graf = [dias, porDia, p]))}</div>
      </section>
`;
    ligarPeriodo(v, "per", "custom", "pp", viewPainel);
    $("#sinc")?.addEventListener("click", async (ev) => {
      const bt = ev.currentTarget; bt.disabled = true; $("#sinc-t").textContent = "Atualizando…";
      try { const r = await api.sincronizar(); toast(api.demo ? "Dados atualizados" : `Atualizado: ${r.conversas ?? 0} conversas nos últimos 7 dias`); }
      catch (e) { toast("Falhou: " + msgErro(e)); }
      viewPainel();
    });
  }

  function grafico(dias, porDia, p) {
    const estreito = window.innerWidth < 600;
    const W = estreito ? 360 : 960, H = estreito ? 190 : 220, L = 26, R = 4, T = 8, B = 24;
    const max = Math.max(4, ...dias.map((d) => porDia[d].c), ...dias.map((d) => porDia[d].r));
    const passo = max <= 8 ? 2 : max <= 20 ? 5 : max <= 50 ? 10 : max <= 100 ? 20 : Math.ceil(max / 5 / 50) * 50;
    const topo = Math.ceil(max / passo) * passo;
    const y = (v) => T + (H - T - B) * (1 - v / topo);
    const bw = (W - L - R) / dias.length, gap = Math.max(1.5, Math.min(6, bw * 0.28));
    const cada = Math.ceil(dias.length / (estreito ? 5 : 10));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conversas e reservas por dia">`;
    for (let v = 0; v <= topo; v += passo) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    dias.forEach((d, i) => {
      const x = L + i * bw + gap / 2, w = bw - gap, c = porDia[d].c, r = porDia[d].r;
      const noP = d >= p.desde && d <= p.ate;
      s += `<g><title>${ddmm(d)}: ${c} conversas, ${r} ${r === 1 ? "reserva" : "reservas"}</title>`;
      s += `<rect x="${x}" y="${y(c)}" width="${w}" height="${Math.max(0, y(0) - y(c))}" rx="2" fill="${noP ? "var(--bar-strong)" : "var(--bar)"}"/>`;
      if (r) s += `<rect x="${x + w * 0.22}" y="${y(r)}" width="${w * 0.56}" height="${y(0) - y(r)}" rx="1.5" fill="var(--accent)"/>`;
      s += `</g>`;
      const ult = i === dias.length - 1 && (dias.length - 1) % cada >= cada / 2;
      if (i % cada === 0 || ult) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${ddmm(d)}</text>`;
    });
    return s + `</svg>`;
  }

  // ---------- Reservas ----------
  async function viewReservas() {
    const v = $("#view");
    const p = periodo(S.resPer, S.resCustom);
    v.innerHTML = `${seletorPeriodo(S.resPer, S.resCustom, "rp")}<div class="carregando">Carregando…</div>`;
    ligarPeriodo(v, "resPer", "resCustom", "rp", viewReservas);
    let res;
    try { res = await api.reservas(p.desde, p.ate); }
    catch (e) { $(".carregando", v).outerHTML = `<div class="aviso">Não foi possível carregar as reservas: ${esc(msgErro(e))}</div>`; return; }
    if (S.view !== "reservas") return;
    S._res = res;
    v.innerHTML = `
      ${seletorPeriodo(S.resPer, S.resCustom, "rp")}
      <div class="cab"><h1>${rotuloPeriodo(p)}</h1><div class="resumo" id="resumo"></div></div>
      <input class="busca" id="busca" type="search" placeholder="Buscar hóspede, telefone ou observação" value="${esc(S.busca)}" aria-label="Buscar reservas">
      <div class="lista" id="lista"></div>`;
    ligarPeriodo(v, "resPer", "resCustom", "rp", viewReservas);
    $("#busca").addEventListener("input", (e) => { S.busca = e.target.value; listar(); });
    listar();
  }
  function listar() {
    const q = S.busca.trim().toLowerCase();
    const lst = (S._res || []).filter((r) => !q || [r.hospede, r.telefone, r.observacao].join(" ").toLowerCase().includes(q));
    const ok = lst.filter((r) => r.status !== "cancelada");
    $("#resumo").innerHTML = `<span><b>${ok.length}</b> ${ok.length === 1 ? "reserva" : "reservas"}</span><span><b>${fmtMoeda0(ok.reduce((s, r) => s + +r.valor, 0))}</b></span>`;
    const el = $("#lista");
    if (!lst.length) {
      el.innerHTML = `<div class="vazio">${q ? "Nenhuma reserva encontrada com essa busca." : "Nenhuma reserva lançada neste período."}${q ? "" : `<button class="btn btn-p" id="nova2">+ Nova reserva</button>`}</div>`;
      $("#nova2")?.addEventListener("click", () => abrirForm()); return;
    }
    el.innerHTML = lst.map((r, i) => {
      const n = r.checkin && r.checkout ? diasEntre(r.checkin, r.checkout) : null;
      const est = r.checkin ? `${ddmm(r.checkin)} → ${ddmm(r.checkout)}${n ? ` · ${noitesTxt(n)}` : ""}` : "sem datas";
      return `<button class="res ${r.status}" data-i="${i}">
        <span class="d"><b>${+r.data_confirmacao.slice(8, 10)}</b>${MESES[+r.data_confirmacao.slice(5, 7) - 1]}</span>
        <span style="min-width:0"><span class="n">${esc(r.hospede)}</span><span class="m">${r.status === "cancelada" ? "Cancelada · " : ""}${est}</span></span>
        <span class="val">${fmtMoeda(+r.valor)}</span>
      </button>`;
    }).join("");
    el.querySelectorAll(".res").forEach((b) => b.addEventListener("click", () => abrirForm(lst[+b.dataset.i])));
  }

  // ---------- Formulário de reserva ----------
  function abrirForm(r) {
    const ed = !!r; r = r || { data_confirmacao: hoje(), status: "confirmada" };
    const veu = document.createElement("div"); veu.className = "veu";
    veu.innerHTML = `<form class="folha" id="f-res" novalidate role="dialog" aria-modal="true" aria-labelledby="f-tit">
      <div class="folha-h"><h2 id="f-tit">${ed ? "Editar reserva" : "Nova reserva"}</h2><button type="button" class="btn btn-g" id="f-x" aria-label="Fechar">✕</button></div>
      ${r.status === "cancelada" ? `<div class="confirma">Reserva cancelada. Não entra nas métricas.</div>` : ""}
      <div class="campos">
        <div class="campo full"><label for="f-hosp">Hóspede</label><input id="f-hosp" required value="${esc(r.hospede || "")}" autocomplete="off"></div>
        <div class="campo"><label for="f-valor">Valor total (R$)</label><input id="f-valor" inputmode="decimal" required value="${r.valor != null ? String(r.valor).replace(".", ",") : ""}" placeholder="0,00"></div>
        <div class="campo"><label for="f-data">Confirmada em</label><input id="f-data" type="date" required value="${r.data_confirmacao || ""}" max="${hoje()}"></div>
        <div class="campo"><label for="f-in">Check-in</label><input id="f-in" type="date" value="${r.checkin || ""}"></div>
        <div class="campo"><label for="f-out">Check-out</label><input id="f-out" type="date" value="${r.checkout || ""}"></div>
        <div class="noites" id="f-noites"></div>
        <div class="campo full"><label for="f-tel">WhatsApp <small>opcional</small></label><input id="f-tel" inputmode="tel" value="${esc(r.telefone || "")}" placeholder="(85) 9 0000-0000"></div>
        <div class="campo full"><label for="f-obs">Observação <small>opcional</small></label><textarea id="f-obs">${esc(r.observacao || "")}</textarea></div>
      </div>
      <div id="f-erro"></div>
      <div class="acoes">
        ${ed ? (r.status === "cancelada" ? `<button type="button" class="btn" id="f-reat">Reativar</button>` : `<button type="button" class="btn btn-g btn-d" id="f-canc">Cancelar reserva</button>`) : ""}
        <button type="submit" class="btn btn-p" id="f-ok">${ed ? "Salvar" : "Salvar reserva"}</button>
      </div>
      <div id="f-conf"></div>
    </form>`;
    document.body.appendChild(veu);
    const fechar = () => { veu.remove(); document.removeEventListener("keydown", tecla); };
    const tecla = (e) => { if (e.key === "Escape") fechar(); };
    document.addEventListener("keydown", tecla);
    veu.addEventListener("click", (e) => { if (e.target === veu) fechar(); });
    $("#f-x", veu).addEventListener("click", fechar);
    if (!ed) setTimeout(() => $("#f-hosp", veu).focus(), 30);
    const noites = () => { const a = $("#f-in", veu).value, b = $("#f-out", veu).value; const n = a && b ? diasEntre(a, b) : null; $("#f-noites", veu).textContent = n > 0 ? noitesTxt(n) : n != null ? "O check-out precisa ser depois do check-in." : ""; };
    $("#f-in", veu).addEventListener("change", () => { const a = $("#f-in", veu).value, o = $("#f-out", veu); if (a && (!o.value || o.value <= a)) o.value = somarDias(a, 1); noites(); });
    $("#f-out", veu).addEventListener("change", noites); noites();

    async function salvar(extra) {
      const d = {
        hospede: $("#f-hosp", veu).value.trim(), data_confirmacao: $("#f-data", veu).value,
        valor: parseValor($("#f-valor", veu).value), checkin: $("#f-in", veu).value || null, checkout: $("#f-out", veu).value || null,
        telefone: $("#f-tel", veu).value.trim() || null, observacao: $("#f-obs", veu).value.trim() || null, ...extra,
      };
      const erros = [];
      veu.querySelectorAll(".campo").forEach((c) => c.classList.remove("erro"));
      const marca = (id, t) => { erros.push(t); $(id, veu).parentElement.classList.add("erro"); };
      if (!d.hospede) marca("#f-hosp", "Informe o nome do hóspede.");
      if (!isFinite(d.valor) || d.valor < 0) marca("#f-valor", "Informe o valor total, por exemplo 850,00.");
      if (!d.data_confirmacao) marca("#f-data", "Informe a data em que a reserva foi confirmada.");
      if (d.checkin && d.checkout && d.checkout <= d.checkin) marca("#f-out", "O check-out precisa ser depois do check-in.");
      $("#f-erro", veu).innerHTML = erros.length ? `<div class="aviso" role="alert">${erros.map(esc).join("<br>")}</div>` : "";
      if (erros.length) return;
      if (ed) d.id = r.id;
      veu.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        await api.salvarReserva(d); fechar();
        toast(extra?.status === "cancelada" ? "Reserva cancelada" : extra?.status === "confirmada" ? "Reserva reativada" : ed ? "Alterações salvas" : "Reserva salva");
        if (S.view === "reservas") viewReservas(); else if (S.view === "painel") viewPainel();
      } catch (e) {
        veu.querySelectorAll("button").forEach((b) => (b.disabled = false));
        $("#f-erro", veu).innerHTML = `<div class="aviso" role="alert">Não foi possível salvar: ${esc(msgErro(e))}</div>`;
      }
    }
    $("#f-res", veu).addEventListener("submit", (e) => { e.preventDefault(); salvar(); });
    $("#f-reat", veu)?.addEventListener("click", () => salvar({ status: "confirmada" }));
    $("#f-canc", veu)?.addEventListener("click", () => {
      $("#f-conf", veu).innerHTML = `<div class="confirma">Cancelar a reserva de ${esc(r.hospede)}? Ela fica na lista, riscada, e sai das métricas.
        <div class="acoes"><button type="button" class="btn" id="f-nao">Manter</button><button type="button" class="btn btn-p" style="background:var(--bad);border-color:var(--bad)" id="f-sim">Sim, cancelar</button></div></div>`;
      $("#f-nao", veu).addEventListener("click", () => ($("#f-conf", veu).innerHTML = ""));
      $("#f-sim", veu).addEventListener("click", () => salvar({ status: "cancelada" }));
    });
  }

  // redesenha o gráfico quando cruza a largura de celular
  let largo = window.innerWidth >= 600;
  window.addEventListener("resize", () => {
    const l = window.innerWidth >= 600; if (l === largo) return; largo = l;
    const el = $(".chart"); if (el && S._graf) el.innerHTML = grafico(...S._graf);
  });

  // =====================================================================
  // Início
  // =====================================================================
  async function iniciarApp() {
    const sess = await api.sessao();
    if (!sess) { telaLogin(); return; }
    S.user = sess.user;
    try { S.config = await api.config(); } catch { /* segue sem */ }
    casca();
  }

  if (!DEMO && !window.supabase) {
    app.innerHTML = `<div class="wrap" style="padding-block:40px"><div class="aviso">Não foi possível carregar a biblioteca do Supabase. Confira a conexão e recarregue a página.</div></div>`;
    return;
  }
  if (!api.demo) {
    let jaIniciou = false;
    api.onAuth((ev, sess) => {
      if (ev === "PASSWORD_RECOVERY" || (api.tipoLink === "invite" && sess && !jaIniciou)) { jaIniciou = true; S.loginModo = "senha"; S.loginMsg = null; telaLogin(); return; }
      if (ev === "SIGNED_OUT") { S.user = null; S.loginModo = "entrar"; telaLogin(); return; }
      if (ev === "SIGNED_IN" && !S.user && S.loginModo !== "senha") { iniciarApp(); }
    });
    const hashErro = new URLSearchParams(location.hash.slice(1)).get("error_description");
    if (hashErro) {
      history.replaceState(null, "", location.pathname);
      S.loginMsg = { t: /expired|invalid/i.test(hashErro) ? "Esse link expirou ou já foi usado. Peça um novo convite ou use “Esqueci minha senha”." : hashErro, erro: true };
      telaLogin();
    } else if (api.tipoLink === "invite" || api.tipoLink === "recovery") {
      setTimeout(() => { if (!jaIniciou && !S.user) iniciarApp(); }, 4000);
    } else {
      iniciarApp();
    }
  } else {
    iniciarApp();
  }
})();
</script>
</body>
</html>
